server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Single-page app fallback.
  #
  # Without this, nginx looks for a real file at /products/milk or /orders and
  # returns 404 on refresh or on any shared deep link. Every unknown path has to
  # be handed to index.html so React Router can resolve it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets never change, so cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html must never be cached, or users keep booting an old bundle.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml font/woff2;

  # Basic hardening
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "SAMEORIGIN" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
